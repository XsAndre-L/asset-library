name: XServer Docker Image

on:
  push:
    branches: [xserver]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub-xserver
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/xserver'
    runs-on: ubuntu-latest

    steps:
      - name: Check publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for setting in DOCKERHUB_USERNAME DOCKERHUB_REPOSITORY DOCKERHUB_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting in repository Settings > Secrets and variables > Actions. See docs/docker-hub.md."
              exit 1
            fi
          done

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:xserver
            docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
