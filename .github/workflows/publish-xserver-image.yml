name: XServer Docker Image

on:
  push:
    branches: [xserver]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-xserver
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/xserver'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare private package
        id: package
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const name = context.repo.repo.toLowerCase();
            const scope = context.payload.repository.owner.type === 'Organization' ? 'orgs' : 'users';
            const endpoint = `GET /${scope}/${owner}/packages/container/${encodeURIComponent(name)}`;

            try {
              const { data } = await github.request(endpoint);
              if (data.visibility !== 'private') {
                throw new Error('Expected private GHCR package; API reported visibility: ' + JSON.stringify(data.visibility) + '; response fields: ' + Object.keys(data).join(', '));
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('New GHCR packages are private by default.');
            }

            core.setOutput('image', `ghcr.io/${owner.toLowerCase()}/${name}`);
            core.setOutput('endpoint', endpoint);

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.package.outputs.image }}:xserver
            ${{ steps.package.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify package is private
        uses: actions/github-script@v7
        env:
          PACKAGE_ENDPOINT: ${{ steps.package.outputs.endpoint }}
        with:
          script: |
            const { data } = await github.request(process.env.PACKAGE_ENDPOINT);
            if (data.visibility !== 'private') {
              throw new Error('Expected private GHCR package; API reported visibility: ' + JSON.stringify(data.visibility) + '; response fields: ' + Object.keys(data).join(', '));
            }
            core.info(`Verified private package: ${data.name}`);
